[develop]
script_dir=$base/lib/lab

[install]
install_scripts=$base/lib/lab

[flake8]
max-line-length = 100
# The default ament_flake8 profile is stricter than this lab needs. These
# exclusions keep the checker useful without fighting black-compatible spacing.
extend-ignore = E203, W503
exclude = .git,__pycache__,build,install,log
